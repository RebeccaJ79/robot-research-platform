<script>
const snapshot=JSON.parse(document.getElementById('publication-data').textContent);
const labels={daily:'每日关注',weekly:'周报',monthly:'月报',graph:'产业链图谱'};
const colors=['#5470c6','#91cc75','#fac858','#ee6666','#73c0de','#3ba272','#fc8452','#9a60b4'];
const pale=['#b7c4e7','#c8e6ba','#fde4a4','#f6b5b5','#bfe4ef','#b5ddcf','#f8c6ae','#d0b9e1'];
let tab='daily',selectedNode=null;
const pct=v=>Number.isFinite(Number(v))?((Number(v)*100).toFixed(2).replace(/\.00$/,'')+'%'):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function nav(){document.getElementById('nav').innerHTML=Object.entries(labels).map(([k,v])=>'<button class="'+(tab===k?'active':'')+'" onclick="chooseTab(\''+k+'\')">'+v+'</button>').join('')}
function chooseTab(v){tab=v;selectedNode=null;render()}
function fmtPeriod(v){if(!v)return'—';return String(v).replace(/(\d{4})(\d{2})(\d{2})/,'$1年$2月$3日')}
function metricCards(r){const h=r.highlights||{};const tags=h.tags||[];return '<section class="metrics"><div class="metric"><span class="muted">重点节点</span><b>'+esc(h.selected_node_count||0)+'</b></div><div class="metric"><span class="muted">观察标签</span><b>'+tags.length+'</b></div><div class="metric"><span class="muted">重点公司</span><b>'+((r.company_focus||[]).length)+'</b></div></section>'}
function lineChart(c){const rows=(c.data||[]).filter(x=>Number.isFinite(Number(x[c.metric?.field])));if(!rows.length)return'<div class="empty">暂无可展示数据</div>';const field=c.metric?.field||'node_return', dates=[...new Set(rows.map(x=>x.trade_date))], names=[...new Set(rows.map(x=>x.node_name))], vals=rows.map(x=>Number(x[field])), lo=Math.min(...vals,0),hi=Math.max(...vals,0),w=540,h=270,p={l:42,r:12,t:18,b:34},sx=i=>p.l+i*(w-p.l-p.r)/Math.max(dates.length-1,1),sy=v=>p.t+(hi-v)*(h-p.t-p.b)/Math.max(hi-lo,.01);let svg='<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="'+esc(c.title)+'"><line x1="'+p.l+'" x2="'+(w-p.r)+'" y1="'+sy(0)+'" y2="'+sy(0)+'" stroke="#9ab3b5" stroke-dasharray="5 4"/>';names.forEach((n,i)=>{const pts=rows.filter(x=>x.node_name===n).map(x=>sx(dates.indexOf(x.trade_date))+','+sy(Number(x[field]))).join(' ');svg+='<polyline fill="none" stroke="'+colors[i%colors.length]+'" stroke-width="2.5" points="'+pts+'"/>'});svg+='<text x="'+p.l+'" y="'+(h-10)+'" fill="#74838b" font-size="11">'+esc(fmtPeriod(dates[0]))+'</text><text x="'+(w-85)+'" y="'+(h-10)+'" fill="#74838b" font-size="11">'+esc(fmtPeriod(dates.at(-1)))+'</text></svg>';return svg}
function pairs(report,chart){if(chart.type==='grouped_bar'){const field=chart.metric?.field||'period_excess_return',groups={};(chart.data||[]).forEach(x=>{(groups[x.node_name]??=[]).push({value:Number(x[field]),period:x.period})});return Object.entries(groups).map(([name,values])=>({name,current:values.find(x=>String(x.period).includes('本'))?.value??values[0]?.value,previous:values.find(x=>!String(x.period).includes('本'))?.value??values[1]?.value}))}const trend=(report.charts||[]).find(x=>x.type==='line');if(!trend)return[];const field=trend.metric?.field||'node_return',dates=[...new Set((trend.data||[]).map(x=>x.trade_date))];return [...new Set((chart.data||[]).map(x=>x.node_name))].map(name=>{const a=(trend.data||[]).filter(x=>x.node_name===name).sort((x,y)=>String(x.trade_date).localeCompare(String(y.trade_date)));return{name,current:Number(a.at(-1)?.[field]),previous:Number(a.at(-2)?.[field])}}).filter(x=>Number.isFinite(x.current)||Number.isFinite(x.previous))}
function comparison(report,c){const rows=pairs(report,c);if(!rows.length)return'<div class="empty">暂无可展示数据</div>';const vals=rows.flatMap(x=>[x.current,x.previous]).filter(Number.isFinite),max=Math.max(...vals.map(Math.abs),.01),w=540,h=Math.max(240,rows.length*67+35),left=180,right=46,zero=left+(w-left-right)/2,scale=(w-left-right)/2/max;let svg='<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="'+esc(c.title)+'"><line x1="'+zero+'" x2="'+zero+'" y1="8" y2="'+(h-18)+'" stroke="#789092" stroke-dasharray="5 4"/>';rows.forEach((row,i)=>{const y=24+i*67,ci=i%colors.length;svg+='<text x="5" y="'+(y+16)+'" fill="#405760" font-size="12">'+esc(row.name)+'</text>';[[row.current,colors[ci],y,'本期'],[row.previous,pale[ci],y+24,'上一期']].forEach(([v,color,yy,period])=>{if(!Number.isFinite(v))return;const x=v>=0?zero:zero+v*scale,width=Math.abs(v*scale);svg+='<rect x="'+x+'" y="'+yy+'" width="'+Math.max(width,.7)+'" height="17" rx="3" fill="'+color+'"/><text x="'+(v>=0?x+width+6:x-8)+'" y="'+(yy+13)+'" text-anchor="'+(v>=0?'start':'end')+'" fill="#405760" font-size="11">'+pct(v)+'</text>'})});return svg+'</svg>'}
function breadth(c){const d=c.data||[];if(!d.length)return'';return '<div class="wide panel"><h2>'+esc(c.title||'节点涨跌家数')+'</h2><p class="subtitle">'+esc(c.subtitle||'')+'</p><div>'+d.map((x,i)=>'<div style="display:flex;align-items:center;gap:10px;margin:10px 0"><span style="width:145px">'+esc(x.node_name||'节点')+'</span><span style="height:12px;border-radius:5px;background:'+colors[i%colors.length]+';width:'+Math.min(260,Math.abs(Number(x[c.metric?.field]||0))*260)+'px"></span><small>'+pct(x[c.metric?.field])+'</small></div>').join('')+'</div></div>'}
function reportView(report){const charts=report.charts||[],line=charts.find(c=>c.type==='line'),compare=charts.find(c=>c.type==='grouped_bar'||c.type==='bar'),third=charts.find(c=>c!==line&&c!==compare);const companies=report.company_focus||[];return '<div class="eyebrow">已发布研究成果</div><div class="titleline"><h1>'+esc(report.title)+'</h1><div class="period">报告期：'+esc(fmtPeriod(report.period))+'</div></div><section class="summary">'+esc(report.summary||'暂无摘要')+'</section>'+metricCards(report)+'<section class="charts"><article class="panel"><h2>'+esc(line?.title||'关键节点趋势')+'</h2><p class="subtitle">'+esc(line?.subtitle||'')+'</p><div class="svgwrap">'+(line?lineChart(line):'<div class="empty">暂无图表</div>')+'</div></article><article class="panel"><h2>'+esc(compare?.title||'关键节点双期对比')+'</h2><p class="subtitle">各周期独立计算，以 0% 为基准</p><div class="svgwrap">'+(compare?comparison(report,compare):'<div class="empty">暂无图表</div>')+'</div><div class="legend"><span><i></i>深色为本期</span><span><i class="light"></i>浅色为上一期</span></div></article></section>'+(third?breadth(third):'')+'<section class="panel companies"><h2>重点公司</h2><table><thead><tr><th>公司</th><th>所属节点</th><th>关注要点</th></tr></thead><tbody>'+companies.map(x=>'<tr><td>'+esc(x.company_name||x.name||'—')+'</td><td>'+esc(x.node_name||'—')+'</td><td>'+esc(x.rationale||x.reason||x.summary||'—')+'</td></tr>').join('')+'</tbody></table></section>'}
function graphView(){const g=snapshot.graph||{},nodes=g.nodes||[],relations=g.relations||[],groups={U:'上游',M:'中游',D:'下游'};const detail=selectedNode?nodes.find(n=>n.id===selectedNode):null;return '<div class="eyebrow">已发布研究成果</div><div class="titleline"><h1>产业链图谱</h1><div class="period">共 '+nodes.length+' 个节点 · '+relations.length+' 条关系</div></div><section class="summary">展示已发布的机器人产业链节点及其关联关系。点击节点可查看其公开关联。</section><div class="graph-grid">'+Object.entries(groups).map(([stream,name])=>'<section class="stream"><h2>'+name+'</h2>'+nodes.filter(n=>n.stream===stream).map(n=>'<button class="node" onclick="pickNode(\''+esc(n.id)+'\')">'+esc(n.name)+'<small>层级 '+esc(n.level)+'</small></button>').join('')+'</section>').join('')+'</div><section class="panel details"><h2>'+esc(detail?.name||'节点关系')+'</h2><div>'+((detail?relations.filter(r=>r.source_node_id===detail.id||r.target_node_id===detail.id):relations).map(r=>{const a=nodes.find(n=>n.id===r.source_node_id)?.name||r.source_node_id,b=nodes.find(n=>n.id===r.target_node_id)?.name||r.target_node_id;return '<span class="relation">'+esc(a)+' → '+esc(b)+' · '+esc(r.name||r.relation_group||'关联')+'</span>'}).join('')||'<p class="muted">暂无公开关联</p>')+'</div></section>'}
function pickNode(id){selectedNode=id;render()}function render(){nav();const report=(snapshot.publications||[]).find(x=>x.type===tab);document.getElementById('app').innerHTML=tab==='graph'?graphView():reportView(report)}render();
</script></body></html>
