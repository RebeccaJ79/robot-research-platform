<script src="vendor/echarts.min.js"></script>
<style>
:root{--paper:#f3f1eb;--card:#fbfaf6;--warm-card:#f7f2e8;--ink:#20221f;--muted:#75776f;--line:#d9d6cc;--orange:#ee713b;--green:#2f8069;--shadow:0 14px 40px rgba(40,36,28,.08);--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px "Microsoft YaHei","PingFang SC",sans-serif}.shell{max-width:1240px;margin:auto;padding:9px 22px 36px}.workbench-brandbar{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);position:sticky;top:8px;z-index:5}.brand{display:flex;align-items:center;gap:11px;min-width:230px}.brand-mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:800}.brand-title{font-weight:700;font-size:16px}.caption,.brand-subtitle,.status,.formula,.notes{font-size:12px;color:var(--muted)}.brand-subtitle{margin-top:3px}.tabs{display:flex;gap:7px;flex:1;overflow:auto;padding:4px;background:#e9e6dd;border-radius:13px}.tabs button{flex:0 0 auto;border:0;background:transparent;color:#66675f;padding:9px 13px;border-radius:9px;font:600 14px inherit;cursor:pointer}.tabs button.active{background:var(--card);color:var(--ink);box-shadow:0 2px 7px rgba(61,57,44,.16)}.status{text-align:right;min-width:155px}.status span,.headline-side span{color:var(--green);font-weight:700}.report-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.report-head h1{margin:0;font-size:25px}.headline-card{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(156px,.5fr);gap:16px;padding:16px 18px;background:var(--warm-card);border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 20px rgba(61,57,44,.05)}.headline-card h2{font-size:17px;margin:0 0 7px}.headline-card__main{text-align:left}.headline-card ul{margin:0;padding-left:19px}.headline-card li{margin:5px 0;line-height:1.55}.headline-side{border-left:1px solid var(--l relation{display:inline-block;background:#f2eee5;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:4px;font-size:13px}.loading,.error{padding:35px;text-align:center;color:var(--muted)}@media(max-width:850px){.workbench-brandbar{align-items:flex-start;flex-direction:column}.brand,.status{min-width:0}.status{text-align:left}.tabs{width:100%}.charts,.graph-grid,.metrics{grid-template-columns:1fr}.headline-card{grid-template-columns:1fr}.headline-side{border-left:0;border-top:1px solid var(--line);padding:10px 0 0}.chain-row{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.shell{padding:8px 12px 30px}}
</style></head>
<body><main class="shell"><header class="workbench-brandbar"><div class="brand"><div class="brand-mark">R</div><div><div class="brand-title">机器人产业研究台</div><div class="brand-subtitle">决策与证据工作流</div></div></div><nav class="tabs" id="tabs"></nav><div class="status">公开研究平台<br><span>已发布成果</span></div></header><div id="app" class="loading">正在读取已发布成果…</div></main>
<script>
var labels={daily:'每日关注',weekly:'周报',monthly:'月报',graph:'产业链图谱'},palette=['#5470c6','#91cc75','#fac858','#ee6666','#73c0de','#3ba272'],pale=['#b7c4e7','#c8e6ba','#fde4a4','#f6b5b5','#bfe4ef','#b5ddcf'],snapshot,tab='daily',selected;
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(s){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]})}function pct(value){var n=Number(value);return Number.isFinite(n)?(n>=0?'+':'')+(n*100).toFixed(1)+'%':'—'}function date(value){var v=String(value||'');return /^\d{8}$/.test(v)?v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6):v||'—'}function axisDate(value){var v=String(value||'');return /^\d{8}$/.test(v)?v.slice(4,6)+'-'+v.slice(6):/^\d{4}-\d{2}-\d{2}$/.test(v)?v.slice(5):v||'—'}function summaryLines(text){return String(text||'暂无文字结论。').split(/(?<=[。！？；])/).map(function(x){return x.trim()}).filter(Boolean)}
function nav(){var root=document.getElementById('tabs');root.innerHTML=Object.keys(labels).map(function(key){return '<button class="'+(tab===key?'active':'')+'" data-tab="'+key+'">'+labels[key]+'</button>'}).join('');root.querySelectorAll('[data-tab]').forEach(function(button){button.addEventListener('click',function(){chooseTab(button.dataset.tab)})})}function chooseTab(key){tab=key;selected=null;render()}
function comparisonPairs(report,chart){if(chart.type==='grouped_bar'){var field=(chart.metric||{}).field||'period_excess_return',groups={};(chart.data||[]).forEach(function(row){(groups[row.node_name]||(groups[row.node_name]=[])).push(row)});return Object.keys(groups).map(function(name){var rows=groups[name],now=rows.find(function(x){return String(x.period).indexOf('本')>=0})||rows[0],previous=rows.find(function(x){return x!==now});return {name:name,current:Number(now&&now[field]),previous:Number(previous&&previous[field])}})}var trend=(report.charts||[]).find(function(x){return x.type==='line'}),field2=(trend&&trend.metric||{}).field||'node_return';return Array.from(new Set((chart.data||[]).map(function(x){return x.node_name}))).map(function(name){var rows=(trend&&trend.data||[]).filter(function(x){return x.node_name===name}).sort(function(a,b){return String(a.trade_date).localeCompare(String(b.trade_date))});return {name:name,current:Number(rows.at(-1)&&rows.at(-1)[field2]),previous:Number(rows.at(-2)&&rows.at(-2)[field2])}})}
function comparisonPoint(value,index,light){var n=Number(value);return {value:Number.isFinite(n)?n*100:null,itemStyle:{color:(light?pale:palette)[index%(light?pale.length:palette.length)]},label:Number.isFinite(n)?{show:true,position:n>=0?'right':'left',formatter:(n>=0?'+':'')+(n*100).toFixed(2)+'%',color:'#354154',fontSize:11,fontWeight:600}:undefined}}
function chartOptions(report,chart){var rows=chart.data||[],metric=chart.metric||{},field=metric.field||'',base={textStyle:{fontFamily:'Microsoft YaHei'},grid:{left:54,right:24,top:50,bottom:62,containLabel:true},tooltip:{trigger:'axis'},title:{text:chart.title||'图表',subtext:chart.subtitle||'',textStyle:{fontSize:16,fontWeight:600},subtextStyle:{fontSize:12,color:'#75776f'}},legend:{bottom:4,type:'scroll'}};
if(chart.type==='line'){var xf=(chart.x_axis||{}).field||'trade_date',dates=(chart.x_axis||{}).values||Array.from(new Set(rows.map(function(x){return x[xf]}))),names=Array.from(new Set(rows.map(function(x){return x.node_name})));return Object.assign(base,{xAxis:{type:'category',data:dates.map(axisDate),axisLabel:{interval:0,hideOverlap:false,rotate:(chart.x_axis||{}).label_angle||0}},yAxis:{type:'value',axisLabel:{formatter:'{value}%'}},series:names.map(function(name,i){return {name:name,type:'line',smooth:true,showSymbol:false,itemStyle:{color:palette[i%palette.length]},data:dates.map(function(d){var row=rows.find(function(x){return x.node_name===name&&x[xf]===d});return row?Number(row[field])*100:null})}})})}
if(chart.type==='stacked_bar'){return Object.assign(base,{xAxis:{type:'value'},yAxis:{type:'category',data:rows.map(function(x){return x.node_name})},series:[['上涨','up_count','#d94b43'],['下跌','down_count','#2f9b70'],['平盘','flat_count','#8b97a8']].map(function(spec){return {name:spec[0],type:'bar',stack:'总数',itemStyle:{color:spec[2]},label:{show:true,position:'inside'},data:rows.map(function(r){return r[spec[1]]||0})}})})}
var pairs=comparisonPairs(report,chart),values=pairs.flatMap(function(x){return [x.current,x.previous]}).filter(Number.isFinite).map(function(x){return x*100}),bound=Math.max.apply(null,values.map(Math.abs).concat([1]))*1.25;return Object.assign(base,{grid:{left:164,right:50,top:50,bottom:46},xAxis:{type:'value',min:-bound,max:bound,axisLine:{show:false},axisTick:{show:false},axisLabel:{show:false},splitLine:{show:true,lineStyle:{color:'#edf0f4'}}},yAxis:{type:'category',data:pairs.map(function(x){return x.name}),axisLabel:{width:150,overflow:'break'}},legend:{bottom:3,data:['深色为本期','浅色为上一期']},series:[{name:'深色为本期',type:'bar',barMaxWidth:14,data:pairs.map(function(x,i){return comparisonPoint(x.current,i,false)}),markLine:{silent:true,symbol:'none',lineStyle:{type:'dashed',color:'#728096'},label:{show:false},data:[{xAxis:0}]}},{name:'浅色为上一期',type:'bar',barMaxWidth:14,data:pairs.map(function(x,i){return comparisonPoint(x.previous,i,true)})}]})}
function drawChart(id,report,chart){requestAnimationFrame(function(){var root=document.getElementById(id);if(root&&window.echarts){var instance=echarts.init(root);instance.setOption(chartOptions(report,chart));window.addEventListener('resize',function(){instance.resize()},{once:true})}})}
function companyTable(rows){var fields=[['company_name','公司'],['node_name','所属节点'],['current_return','当日/本期涨跌幅'],['period_return','区间累计涨跌幅'],['excess_return','超额收益'],['amount_change','成交额变化'],['focus_rank','关注排名'],['rank_change','排名变化']];return '<div class="company-wrap"><table class="company"><thead><tr>'+fields.map(function(x){return '<th>'+x[1]+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(row){return '<tr>'+fields.map(function(spec){var key=spec[0],number=['current_return','period_return','excess_return','amount_change'].indexOf(key)>=0,value=number?pct(row[key]):(row[key]||'—'),klass=Number(row[key])>0?'positive':Number(row[key])<0?'negative':'';return '<td class="'+klass+'">'+esc(value)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function transmission(items){if(!items||!items.length)return '';function card(name,summary,stream){return name?'<div class="node-card '+String(stream||'').toLowerCase()+'"><strong>'+esc(name)+'</strong><br><small>'+esc(summary||'本期无明确状态')+'</small></div>':'<div></div>'}return '<h2 class="section-title">产业链传导</h2>'+items.map(function(item){return '<div class="chain-row">'+card(item.source,item.source_summary,item.source_stream)+'<div class="arrow">'+esc(item.relation||'条件性传导')+'<b>→</b><small>'+esc(item.status||'条件性推进')+'</small></div>'+card(item.target,item.target_summary,item.target_stream)+'<div class="chain-text">'+esc(item.text||'')+'</div></div>'}).join('')}
function reportView(report){var h=report.highlights||{},charts=report.charts||[],chartHtml=charts.map(function(chart,i){return '<article class="panel"><div id="chart-'+i+'" class="chart"></div><div class="formula">'+esc((chart.metric||{}).formula||'')+(chart.notes||[]).map(function(x){return '　'+esc(x)}).join('')+'</div></article>'}).join('');setTimeout(function(){charts.forEach(function(chart,i){drawChart('chart-'+i,report,chart)})},0);var viewpoint=summaryLines(report.summary).map(function(x){return '<li>'+esc(x)+'</li>'}).join('');return '<div class="report-head"><div><div class="caption">报告日期：'+date(report.period)+'</div><h1>'+esc(report.title)+'</h1></div><div class="caption">最近更新：'+esc(String(report.generated_at||'').slice(11,16)||'—')+'<br>耗时：'+(report.generation_elapsed_seconds==null?'—':report.generation_elapsed_seconds)+'s</div></div><section class="headline-card"><div class="headline-card__main"><h2>核心观点</h2><ul>'+viewpoint+'</ul></div><aside class="headline-side"><strong>'+esc(h.label||'AI Research')+'</strong><span>'+esc(h.status||'正式报告')+'</span><small>基于已发布数据与产业链关系整合</small></aside></section><div class="tags">'+(h.tags||[]).map(function(x){return '#'+esc(x)}).join(' · ')+'</div><section class="metrics"><div class="metric"><span class="caption">重点节点</span><b>'+(h.selected_node_count||0)+'</b></div><div class="metric"><span class="caption">正式结论</span><b>'+(report.conclusions||[]).length+'</b></div><div class="metric"><span class="caption">重点公司</span><b>'+(report.company_focus||[]).length+'</b></div></section><section class="charts">'+chartHtml+'</section><h2 class="section-title">重点公司</h2><article class="panel">'+companyTable(report.company_focus||[])+'<div class="notes">计算口径：收益率按有效交易日计算；重点公司按公司去重排名，所属节点展示全部已验证映射。</div></article><div class="notes">'+(report.data_notes||[]).map(function(x){return '数据提示：'+esc(x)}).join('<br>')+'</div>'+transmission(report.transmission_map)}
function mindMapOptions(graph){var nodes=graph.nodes||[],relations=graph.relations||[],colors={U:'#5470c6',M:'#ee713b',D:'#2f8069'},groups={U:[],M:[],D:[]},byId={};nodes.forEach(function(node){byId[node.id]=node;(groups[node.stream]||groups.M).push(node)});Object.keys(groups).forEach(function(key){groups[key].sort(function(a,b){return String(a.id).localeCompare(String(b.id))})});var tallest=Math.max(groups.U.length,groups.M.length,groups.D.length,1),height=Math.max(640,tallest*70+120),x={U:160,M:520,D:880},data=nodes.map(function(node){var list=groups[node.stream]||groups.M,index=list.indexOf(node),isActive=!selected||selected===node.id,connected=selected&&relations.some(function(relation){return (relation.source_node_id===selected&&relation.target_node_id===node.id)||(relation.target_node_id===selected&&relation.source_node_id===node.id)});return {id:node.id,name:node.name,x:x[node.stream]||520,y:70+index*((height-140)/Math.max(list.length-1,1)),symbolSize:[Math.max(82,node.name.length*16),42],itemStyle:{color:colors[node.stream]||colors.M,opacity:isActive||connected?1:.32},label:{color:'#20221f',fontSize:12,fontWeight:selected===node.id?700:500}}}),links=[],seen={};function addLink(source,target,name,kind){var key=source+'>'+target;if(source&&target&&byId[source]&&byId[target]&&!seen[key]){seen[key]=true;links.push({source:source,target:target,name:name||'',lineStyle:{color:kind==='relation'?'#7a8797':'#bac2cc',width:kind==='relation'?2:1,type:kind==='relation'?'solid':'dashed',curveness:kind==='relation'?.12:0}})}}nodes.forEach(function(node){if(node.parent_id)addLink(node.parent_id,node.id,'','parent')});relations.forEach(function(relation){addLink(relation.source_node_id,relation.target_node_id,relation.name||relation.relation_group,'relation')});return {animationDuration:350,tooltip:{formatter:function(params){if(params.dataType==='edge')return esc(params.data.name||'产业链关联');var node=byId[params.data.id]||{};return '<b>'+esc(node.name||params.name)+'</b><br>产业环节：'+esc(({U:'上游',M:'中游',D:'下游'})[node.stream]||'—')+'<br>点击查看关联关系'}},graphic:[{type:'text',left:110,top:16,style:{text:'上游',fill:'#5470c6',font:'600 14px Microsoft YaHei'}},{type:'text',left:'48%',top:16,style:{text:'中游',fill:'#ee713b',font:'600 14px Microsoft YaHei'}},{type:'text',right:110,top:16,style:{text:'下游',fill:'#2f8069',font:'600 14px Microsoft YaHei'}}],series:[{type:'graph',layout:'none',data:data,links:links,roam:true,edgeSymbol:['none','arrow'],edgeSymbolSize:[0,8],edgeLabel:{show:true,formatter:function(params){return params.data.name||''},position:'middle',color:'#50647b',fontSize:12,fontWeight:600,backgroundColor:'#fff',padding:[2,4]},lineStyle:{opacity:.78},label:{show:true,position:'inside',overflow:'break',width:112,align:'center'},emphasis:{focus:'adjacency',lineStyle:{width:3},label:{fontWeight:700}}}]}}
function drawMindMap(graph){requestAnimationFrame(function(){var root=document.getElementById('chain-mind-map');if(!root||!window.echarts)return;var instance=echarts.init(root);instance.setOption(mindMapOptions(graph));instance.on('click',function(params){if(params.dataType==='node'&&params.data&&params.data.id)pickNode(params.data.id)});window.addEventListener('resize',function(){instance.resize()},{once:true})})}
function graphView(graph){var nodes=graph.nodes||[],relations=graph.relations||[],names={};nodes.forEach(function(x){names[x.id]=x.name});var display=selected?relations.filter(function(x){return x.source_node_id===selected||x.target_node_id===selected}):relations;setTimeout(function(){drawMindMap(graph)},0);return '<div class="report-head"><div><div class="caption">已发布产业链关系</div><h1>产业链图谱</h1></div><div class="caption">当前共 '+nodes.length+' 个节点、'+relations.length+' 条关系<br>拖动或滚轮缩放；点击节点聚焦关联</div></div><section class="headline-card"><div><h2>图谱说明</h2><ul><li>箭头表示已发布的定向产业链关系；虚线表示节点层级。</li><li>点击节点可查看其公开关联关系。</li></ul></div><aside class="headline-side"><strong>公开图谱</strong><span>已发布</span></aside></section><article class="panel" style="margin-top:16px"><div id="chain-mind-map" class="mind-map"></div></article><h2 class="section-title">公开关系</h2><article class="panel">'+(display.map(function(x){return '<span class="relation">'+esc(names[x.source_node_id]||x.source_node_id)+' → '+esc(names[x.target_node_id]||x.target_node_id)+' · '+esc(x.name||x.relation_group||'关联')+'</span>'}).join('')||'<span class="caption">该节点暂无公开关联。</span>')+'</article>'}function pickNode(id){selected=id;render()}function render(){nav();var root=document.getElementById('app');root.innerHTML=tab==='graph'?graphView(snapshot.graph||{}):reportView((snapshot.publications||[]).find(function(x){return x.type===tab})||{});root.querySelectorAll('[data-node]').forEach(function(button){button.addEventListener('click',function(){pickNode(button.dataset.node)})})}fetch('data/publications.json').then(function(r){if(!r.ok)throw Error('发布快照不可用');return r.json()}).then(function(data){snapshot=data;render()}).catch(function(e){document.getElementById('app').innerHTML='<div class="error">无法读取已发布成果：'+esc(e.message)+'</div>'});
</script></body></html>
